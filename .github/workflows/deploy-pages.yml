name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web_tools/**'
      - 'tools/bundle_firmware_releases.py'
      - '.github/workflows/deploy-pages.yml'
  # A new firmware release has to be bundled into the site.
  workflow_run:
    workflows: ['Firmware Build and Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24' # SvelteKit 3 needs Node 22.17 or later

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          corepack enable
          yarn --version
          yarn --cwd web_tools install --frozen-lockfile

      - name: Bundle firmware releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/bundle_firmware_releases.py --repo "${{ github.repository }}" --out web_tools/static/firmware

      - name: Build web_tools (SvelteKit + adapter-static)
        env:
          # Set base path for GitHub Pages project site (e.g. /owner/repo). If deploying to a user/org root (user.github.io), override to ''.
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          yarn --cwd web_tools build
          # Optional: bypass Jekyll in the output dir
          touch web_tools/build/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web_tools/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
