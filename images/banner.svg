    <rect x="690.75" y="168.75" width="468.5" height="216.6" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="708" y="186" width="400.0" height="182.1" rx="6" fill="#cfcec7"/>
    <image x="716" y="194" width="384.0" height="166.1" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/>
    <circle cx="1128" cy="208" r="5" fill="#e8a464"/><circle cx="1128" cy="208" r="11" fill="#e8a464" fill-opacity="0.18"/>
  </g>
