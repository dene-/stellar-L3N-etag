<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Stellar firmware and web tool">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1f23"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#e8a464" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8a464" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f4"/>
      <stop offset="1" stop-color="#dddcd5"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="card"><rect width="1280" height="440" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#dots)"/>
    <rect width="1280" height="440" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="27.5" fill="none" stroke="#34373d"/>

  <g transform="translate(72 92)">
    <g transform="scale(1.5)" fill="none">
      <rect x="0.75" y="0.75" width="32.5" height="20.5" rx="3" stroke="#f1f1f2" stroke-width="1.5"/>
      <rect x="5" y="5" width="18" height="12" rx="0.5" stroke="#f1f1f2" stroke-width="1.2"/>
      <path d="M5.6 13.5h16.8" stroke="#e8a464" stroke-width="2.4"/>
      <circle cx="28" cy="7" r="1.5" fill="#e8a464"/>
    </g>
    <text x="68" y="23" font-family="Jost, 'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="5" fill="#b9bdc4">STELLAR</text>
  </g>
  <text font-family="Jost, 'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="64" letter-spacing="-1.5" fill="#f1f1f2">
    <tspan x="70" y="212">Stellar firmware</tspan>
    <tspan x="70" y="284">and web tool</tspan>
  </text>
  <text x="72" y="334" font-family="Jost, 'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8d929b">For Hanshow Stellar e-paper shelf labels</text>
  <g font-family="Jost, 'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="1.5" fill="#b9bdc4">
    <rect x="72" y="358" width="124" height="32" rx="16" fill="none" stroke="#4a4e56"/>
    <text x="134" y="379" text-anchor="middle">TLSR8359</text>
    <rect x="208" y="358" width="166" height="32" rx="16" fill="none" stroke="#4a4e56"/>
    <text x="291" y="379" text-anchor="middle">BLUETOOTH LE</text>
    <rect x="386" y="358" width="214" height="32" rx="16" fill="none" stroke="#4a4e56"/>
    <text x="493" y="379" text-anchor="middle">BLACK · WHITE · <tspan fill="#e5776f">RED</tspan></text>
  </g>

  <g transform="rotate(6 980.0 154.5)" filter="url(#shadow)">
    <rect x="760" y="52" width="440" height="205.1" rx="22" fill="url(#plastic)"/>
    <rect x="760.75" y="52.75" width="438.5" height="203.6" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="778" y="70" width="370.0" height="169.1" rx="6" fill="#cfcec7"/>
    <image x="786" y="78" width="354.0" height="153.1" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/>
    
  </g>

  <g transform="rotate(-4 925.0 277.0)" filter="url(#shadow)">
